[project]
name = "poseaudit"
version = "0.1.2"
description = "Audit a pose model used as a measuring instrument: how wrong are the angles, tilts and lengths it reads off keypoints?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "8rulerstar" }]
keywords = ["pose estimation", "keypoints", "evaluation", "measurement", "computer vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
supervision = ["supervision>=0.30.6"]
plot = ["matplotlib>=3.6"]
images = ["pillow>=12.3"]

[project.scripts]
poseaudit = "poseaudit.cli:main"

[project.urls]
Homepage = "https://github.com/8rulerstar/poseaudit"
Source = "https://github.com/8rulerstar/poseaudit"
Issues = "https://github.com/8rulerstar/poseaudit/issues"
Changelog = "https://github.com/8rulerstar/poseaudit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "hypothesis>=6",
    "supervision>=0.30.6",
    "matplotlib>=3.6",
    "pillow>=12.3",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# notebook cells favour readable one-line prints and a pip line before imports
"*.ipynb" = ["E402", "E501", "I001"]

[tool.hatch.build.targets.sdist]
include = ["/src/poseaudit", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/CITATION.cff"]
