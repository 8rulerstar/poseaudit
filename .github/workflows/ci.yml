name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        resolution: [highest]
        include:
          - os: ubuntu-latest
            python: "3.10"
            resolution: lowest-direct
          - os: macos-latest
            python: "3.13"
            resolution: highest
          - os: windows-latest
            python: "3.13"
            resolution: highest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --python ${{ matrix.python }} --resolution ${{ matrix.resolution }}
      # --no-sync: a plain `uv run` would re-sync to the lockfile and quietly
      # test the newest versions instead of the lowest ones
      - run: uv run --no-sync python -c "import numpy; print(numpy.__version__)"
      - run: uv run --no-sync pytest -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --locked
      # lint with the locked ruff only: the oldest allowed ruff has other rules
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy src
      - run: uv build
      # install the built wheel alone, outside the project, and run the demo
      - run: |
          uv venv /tmp/clean --python 3.12
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          cd examples/coco_elbow
          /tmp/clean/bin/poseaudit audit --format coco --gt gt_200.json \
            --pred pred_yolo11n.json --angle 5,7,9 --big-error 15
